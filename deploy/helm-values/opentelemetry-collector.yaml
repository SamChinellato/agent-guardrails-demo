# OpenTelemetry Collector (7.8, F7): OTLP in; traces to Tempo, logs to Loki, metrics to a
# Prometheus exporter scraped by a ServiceMonitor. image.digest is set by scripts/up.sh.
fullnameOverride: otel-collector
mode: deployment
replicaCount: 1
image:
  repository: docker.io/otel/opentelemetry-collector-contrib
command:
  name: otelcol-contrib
resources:
  requests: {cpu: 50m, memory: 128Mi}
  limits: {cpu: "1", memory: 512Mi}
ports:
  otlp: {enabled: true, containerPort: 4317, servicePort: 4317, protocol: TCP}
  otlp-http: {enabled: true, containerPort: 4318, servicePort: 4318, protocol: TCP}
  prom-exporter: {enabled: true, containerPort: 8889, servicePort: 8889, protocol: TCP}
  metrics: {enabled: true, containerPort: 8888, servicePort: 8888, protocol: TCP}
  jaeger-compact: {enabled: false}
  jaeger-thrift: {enabled: false}
  jaeger-grpc: {enabled: false}
  zipkin: {enabled: false}
serviceMonitor:
  enabled: true
  metricsEndpoints:
    - port: prom-exporter
      interval: 5s
    - port: metrics
      interval: 15s
alternateConfig:
  receivers:
    otlp:
      protocols:
        grpc: {endpoint: "0.0.0.0:4317"}
        http: {endpoint: "0.0.0.0:4318"}
  processors:
    memory_limiter: {check_interval: 1s, limit_percentage: 80, spike_limit_percentage: 25}
    batch: {timeout: 1s, send_batch_size: 512}   # short timeout: OBS-06 freshness
  exporters:
    otlp_grpc/tempo:
      endpoint: tempo.observability.svc.cluster.local:4317
      tls: {insecure: true}
    otlp_http/loki:
      endpoint: http://loki.observability.svc.cluster.local:3100/otlp
    prometheus:
      endpoint: 0.0.0.0:8889
      resource_to_telemetry_conversion: {enabled: true}
      enable_open_metrics: true
  extensions:
    health_check: {endpoint: "0.0.0.0:13133"}
  service:
    extensions: [health_check]
    telemetry:
      metrics:
        readers:
          - pull:
              exporter:
                prometheus: {host: 0.0.0.0, port: 8888}
    pipelines:
      traces:
        receivers: [otlp]
        processors: [memory_limiter, batch]
        exporters: [otlp_grpc/tempo]
      logs:
        receivers: [otlp]
        processors: [memory_limiter, batch]
        exporters: [otlp_http/loki]
      metrics:
        receivers: [otlp]
        processors: [memory_limiter, batch]
        exporters: [prometheus]
