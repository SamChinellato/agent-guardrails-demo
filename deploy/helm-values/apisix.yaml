# APISIX chart values (7.2). Traditional mode, external standalone etcd, no ingress
# controller. image.tag (tag@digest) is set by scripts/up.sh from versions.env.
image:
  repository: docker.io/apache/apisix
  pullPolicy: IfNotPresent

replicaCount: 1

resources:
  requests: {cpu: 100m, memory: 256Mi}
  limits: {cpu: "1", memory: 512Mi}

service:
  type: NodePort
  http:
    enabled: true
    servicePort: 80
    containerPort: 9080
    nodePort: 30080

# The control API (schemas, health) stays in-cluster
control:
  enabled: true
  service:
    type: ClusterIP

apisix:
  enableIPv6: false
  enableServerTokens: false

  deployment:
    mode: traditional
    role: traditional
    role_traditional:
      config_provider: etcd

  admin:
    enabled: true
    enable_admin_ui: false
    type: ClusterIP
    port: 9180
    servicePort: 9180
    cors: false
    credentials:
      # Secret created by scripts/gen-secrets.sh (GW-07); keys: admin, viewer
      secretName: apisix-admin
    allow:
      # Pod CIDR (k3s default) plus loopback for the deliberate kubectl port-forward (GW-07, rule 6)
      ipList:
        - 10.42.0.0/16
        - 127.0.0.1/32

  prometheus:
    enabled: true
    path: /apisix/prometheus/metrics
    metricPrefix: apisix_
    containerPort: 9091

  # Explicit plugin list (7.2). Custom plugins (below) are appended by the chart.
  plugins:
    - fault-injection          # priority 11000: kill switch fires before auth
    - request-validation       # rejects stream:true on the LLM route (GW-04)
    - key-auth
    - consumer-restriction
    - proxy-rewrite
    - ai-prompt-guard
    - ai-proxy
    - ai-proxy-multi
    - opentelemetry
    - prometheus
    - http-logger
    - loki-logger

  # Custom Lua plugins from gateway/plugins/, shipped in ConfigMap apisix-custom-plugins
  # (created by scripts/up.sh). ai-injection-guard joins in P3.
  customPlugins:
    enabled: true
    luaPath: "/opts/custom_plugins/?.lua"
    plugins:
      - name: agent-kill-switch
        attrs: {}
        configMap:
          name: apisix-custom-plugins
          mounts:
            - key: agent-kill-switch.lua
              path: /opts/custom_plugins/apisix/plugins/agent-kill-switch.lua

  pluginAttrs:
    opentelemetry:
      resource:
        service.name: apisix
      collector:
        address: otel-collector.observability.svc.cluster.local:4318
        request_timeout: 3
      set_ngx_var: true
    prometheus:
      export_uri: /apisix/prometheus/metrics
      metric_prefix: apisix_
      export_addr:
        ip: 0.0.0.0
        port: 9091

externalEtcd:
  host:
    - http://etcd.gateway.svc.cluster.local:2379
  user: ""
  password: ""

etcd:
  enabled: false

ingress-controller:
  enabled: false
