# APISIX chart values (7.2). Traditional mode, external standalone etcd, no ingress
# controller. image.tag (tag@digest) is set by scripts/up.sh from versions.env.
image:
  repository: docker.io/apache/apisix
  pullPolicy: IfNotPresent

replicaCount: 1

metrics:
  serviceMonitor:
    enabled: true
    interval: 5s

resources:
  requests: {cpu: 100m, memory: 256Mi}
  limits: {cpu: "2", memory: 1Gi}

service:
  type: NodePort
  http:
    enabled: true
    servicePort: 80
    containerPort: 9080
    nodePort: 30080

# The control API (schemas, health) stays in-cluster
control:
  enabled: true
  service:
    type: ClusterIP

apisix:
  enableIPv6: false
  enableServerTokens: false

  nginx:
    # The chart's "auto" starts one worker per host core (20 here); with the AI plugins that
    # outgrew the memory limit and APISIX was OOM-killed under test load (D-040).
    workerProcesses: 2

  deployment:
    mode: traditional
    role: traditional
    role_traditional:
      config_provider: etcd

  admin:
    enabled: true
    enable_admin_ui: true       # /ui on the admin port; reached only via make admin-ui (D-025)
    type: ClusterIP
    port: 9180
    servicePort: 9180
    cors: false
    credentials:
      # Secret created by scripts/gen-secrets.sh (GW-07); keys: admin, viewer
      secretName: apisix-admin
    allow:
      # Pod CIDR (k3s default) plus loopback for the deliberate kubectl port-forward (GW-07, rule 6)
      ipList:
        - 10.42.0.0/16
        - 127.0.0.1/32

  prometheus:
    enabled: true
    path: /apisix/prometheus/metrics
    metricPrefix: apisix_
    containerPort: 9091

  # Explicit plugin list (7.2). Custom plugins (below) are appended by the chart.
  plugins:
    - fault-injection          # priority 11000: kill switch fires before auth
    - request-validation       # rejects stream:true on the LLM route (GW-04)
    - key-auth
    - consumer-restriction
    - proxy-rewrite
    - redirect                 # /console -> /console/
    - ai-prompt-guard
    - ai-proxy
    - ai-proxy-multi
    - opentelemetry
    - prometheus
    - http-logger
    - loki-logger

  # Custom Lua plugins from gateway/plugins/, one ConfigMap each (apisix-plugin-<name>,
  # created by scripts/up.sh; the chart names a volume per ConfigMap).
  customPlugins:
    enabled: true
    luaPath: "/opts/custom_plugins/?.lua"
    plugins:
      - name: agent-kill-switch
        attrs: {}
        configMap:
          name: apisix-plugin-agent-kill-switch
          mounts:
            - key: agent-kill-switch.lua
              path: /opts/custom_plugins/apisix/plugins/agent-kill-switch.lua
      - name: ai-injection-guard
        attrs: {}
        configMap:
          name: apisix-plugin-ai-injection-guard
          mounts:
            - key: ai-injection-guard.lua
              path: /opts/custom_plugins/apisix/plugins/ai-injection-guard.lua

  pluginAttrs:
    # On 3.19 the collector, resource and batching come from plugin metadata
    # (gateway/plugin_metadata/opentelemetry.json, D-020). set_ngx_var stays here because the
    # CLI only declares $opentelemetry_trace_id/$opentelemetry_span_id in nginx.conf from it.
    opentelemetry:
      set_ngx_var: true
    prometheus:
      export_uri: /apisix/prometheus/metrics
      metric_prefix: apisix_
      export_addr:
        ip: 0.0.0.0
        port: 9091

externalEtcd:
  host:
    - http://etcd.gateway.svc.cluster.local:2379
  user: ""
  password: ""

etcd:
  enabled: false

ingress-controller:
  enabled: false
