# Loki monolithic (SingleBinary) with filesystem storage (7.8, OBS-07).
# loki.image.tag/digest are set by scripts/up.sh.
fullnameOverride: loki
deploymentMode: Monolithic
loki:
  auth_enabled: false
  commonConfig:
    replication_factor: 1
  storage:
    type: filesystem
  useTestSchema: false
  schemaConfig:
    configs:
      - from: "2024-01-01"
        store: tsdb
        object_store: filesystem
        schema: v13
        index: {prefix: index_, period: 24h}
  limits_config:
    retention_period: 24h
    allow_structured_metadata: true      # OTLP attributes (trace_id, span_id) land here
    volume_enabled: true
  compactor:
    retention_enabled: true
    delete_request_store: filesystem
  analytics:
    reporting_enabled: false             # NFR-08
  pattern_ingester:
    enabled: false
  ui:
    enabled: false
singleBinary:
  replicas: 1
  resources:
    requests: {cpu: 100m, memory: 256Mi}
    limits: {cpu: "1", memory: 1Gi}
  persistence:
    enabled: true
    size: 5Gi
read: {replicas: 0}
write: {replicas: 0}
backend: {replicas: 0}
gateway: {enabled: false}
chunksCache: {enabled: false}
resultsCache: {enabled: false}
lokiCanary: {enabled: false}
test: {enabled: false}
minio: {enabled: false}
sidecar:
  rules: {enabled: false}
monitoring:
  selfMonitoring: {enabled: false}
  serviceMonitor: {enabled: false}
