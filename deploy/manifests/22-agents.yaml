# Agents (7.7) and the presenter console (DEMO-01). ${AGENTS_IMAGE}, ${CONSOLE_IMAGE},
# ${LLM_MODEL} and ${HOST_PORT_GRAFANA} are substituted by scripts/up.sh.
---
apiVersion: v1
kind: Service
metadata:
  name: researcher
  namespace: ai
  labels: {app: researcher, demo/metrics: "true"}
spec:
  selector: {app: researcher}
  ports:
    - {name: http, port: 8000, targetPort: 8000}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: researcher
  namespace: ai
  labels: {app: researcher}
spec:
  replicas: 1
  selector:
    matchLabels: {app: researcher}
  template:
    metadata:
      labels: {app: researcher}
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: researcher
          image: ${AGENTS_IMAGE}
          command: ["researcher"]
          env:
            - {name: GATEWAY_URL, value: "http://apisix-gateway.gateway.svc.cluster.local"}
            - name: AGENT_API_KEY
              valueFrom: {secretKeyRef: {name: agent-keys, key: researcher}}
            - {name: MCP_SERVERS, value: "docs"}
            - {name: LLM_MODEL, value: "${LLM_MODEL}"}
            - {name: MAX_STEPS, value: "6"}
            - {name: OTEL_EXPORTER_OTLP_ENDPOINT, value: "http://otel-collector.observability.svc.cluster.local:4318"}
          ports:
            - {name: http, containerPort: 8000}
          readinessProbe:
            httpGet: {path: /readyz, port: http}
            periodSeconds: 2
          livenessProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 10
          resources:
            requests: {cpu: 20m, memory: 128Mi}
            limits: {cpu: 500m, memory: 384Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          volumeMounts:
            - {name: tmp, mountPath: /tmp}
      volumes:
        - name: tmp
          emptyDir: {}
---
