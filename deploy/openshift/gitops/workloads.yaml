# Argo CD for the OpenShift target (OS-08, OS-11), applied by scripts/openshift/gitops.sh
# with ${GITOPS_REPO} and ${GITOPS_REVISION} filled in. The cluster-wide openshift-gitops
# instance deploys into the aigw- namespaces (labelled managed-by); this project limits it
# to them, to this repository, and to namespaced objects: operators, namespaces and other
# cluster-scoped pieces stay with `make up` as cluster-admin.
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: aigw
  namespace: openshift-gitops
spec:
  description: AI gateway demo (docs/OPENSHIFT_MIGRATION.md)
  sourceRepos: ["${GITOPS_REPO}", "${APISIX_CHART_REPO}"]
  destinations:
    - {server: https://kubernetes.default.svc, namespace: "aigw-*"}
  clusterResourceWhitelist: []
---
# The workloads: the repo-root kustomization.yaml (the overlays plus their ConfigMaps)
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: aigw-workloads
  namespace: openshift-gitops
spec:
  project: aigw
  source:
    repoURL: "${GITOPS_REPO}"
    targetRevision: "${GITOPS_REVISION}"
    path: .
  # Every object names its namespace; this default only has to satisfy the project
  destination: {server: https://kubernetes.default.svc, namespace: aigw-ai}
  syncPolicy:
    automated: {prune: true, selfHeal: true}
    syncOptions: [RespectIgnoreDifferences=true]
  ignoreDifferences:
    # The image triggers write the current digest into the pod spec (OS-02). Containers
    # without a trigger (pinned in git: policy-sync) are excluded by name, so their image
    # stays tracked and a newly added one isn't dropped for want of a live value. The
    # selector must hold on both the desired and the live object, hence the name, not the
    # image (a trigger rewrites the image to another registry's digest)
    - group: apps
      kind: Deployment
      jqPathExpressions: ['.spec.template.spec.containers[] | select(.name != "policy-sync") | .image']
    # Changed at runtime by the console and make policy-set (D-043)
    - kind: ConfigMap
      name: guard-policy
      namespace: aigw-ai
      jsonPointers: [/data]
---
# APISIX: the pinned chart with the k3d values plus the OpenShift ones from this repo
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: aigw-apisix
  namespace: openshift-gitops
spec:
  project: aigw
  sources:
    - repoURL: "${APISIX_CHART_REPO}"
      chart: apisix
      targetRevision: "${APISIX_CHART_VERSION}"
      helm:
        releaseName: apisix
        valueFiles:
          - $values/deploy/helm-values/apisix.yaml
          - $values/deploy/openshift/apps/apisix/values.yaml
    - repoURL: "${GITOPS_REPO}"
      targetRevision: "${GITOPS_REVISION}"
      ref: values
  destination: {server: https://kubernetes.default.svc, namespace: aigw-gateway}
  syncPolicy:
    automated: {prune: true, selfHeal: true}
