# OLM operators for the OpenShift target (OS-01, OS-08). Installed by
# scripts/openshift/install-operators.sh as cluster-admin before Argo CD takes over, so the
# shared openshift-gitops instance needs no cluster-wide grants for them (OS-11).
# ${..._CHANNEL} / ${..._CSV} come from versions.env. installPlanApproval is Manual: the
# script approves only the install plan for the pinned CSV, so nothing upgrades on its own.
#
# Each Red Hat operator gets the namespace its documentation uses, with an AllNamespaces
# OperatorGroup. Grafana's (community) is scoped to aigw-observability only.
# ------------------------------------------------------------------ OpenShift GitOps
apiVersion: v1
kind: Namespace
metadata:
  name: openshift-gitops-operator
  labels: {app.kubernetes.io/part-of: ai-gateway-demo}
---
apiVersion: operators.coreos.com/v1
kind: OperatorGroup
metadata: {name: openshift-gitops-operator, namespace: openshift-gitops-operator}
spec: {upgradeStrategy: Default}
---
apiVersion: operators.coreos.com/v1alpha1
kind: Subscription
metadata: {name: openshift-gitops-operator, namespace: openshift-gitops-operator}
spec:
  name: openshift-gitops-operator
  source: redhat-operators
  sourceNamespace: openshift-marketplace
  channel: ${GITOPS_OPERATOR_CHANNEL}
  startingCSV: ${GITOPS_OPERATOR_CSV}
  installPlanApproval: Manual
