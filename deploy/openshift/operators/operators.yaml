# ------------------------------------------------------------------ Grafana (community)
# Watches only aigw-observability (created by deploy/openshift/namespaces.yaml first).
---
apiVersion: operators.coreos.com/v1
kind: OperatorGroup
metadata: {name: aigw-observability, namespace: aigw-observability}
spec:
  targetNamespaces: [aigw-observability]
  upgradeStrategy: Default
---
apiVersion: operators.coreos.com/v1alpha1
kind: Subscription
metadata: {name: grafana-operator, namespace: aigw-observability}
spec:
  name: grafana-operator
  source: community-operators
  sourceNamespace: openshift-marketplace
  channel: ${GRAFANA_OPERATOR_CHANNEL}
  startingCSV: ${GRAFANA_OPERATOR_CSV}
  installPlanApproval: Manual
