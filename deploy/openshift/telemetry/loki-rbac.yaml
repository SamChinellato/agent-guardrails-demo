# Access to the LokiStack gateway (openshift-logging tenancy), namespaced part; the
# cluster roles and bindings are in ../platform/telemetry.yaml. The gateway authorises by
# SubjectAccessReview on loki.grafana.com/<tenant>: create = write, get = read.
# The OTel collector writes (its ServiceAccount is in collector.yaml); Grafana and the
# evidence CLI read as loki-reader.
apiVersion: v1
kind: ServiceAccount
metadata: {name: loki-reader, namespace: aigw-observability}
---
# APISIX's loki-logger pushes access logs straight to the gateway (the Red Hat collector has
# no Loki receiver). Its plugin config can only carry a static header, so this writer gets a
# long-lived token Secret, rendered into gateway/ by the bootstrap (encrypted at rest by
# APISIX: loki-logger encrypt_fields = headers). It can only write application logs.
apiVersion: v1
kind: ServiceAccount
metadata: {name: apisix-log-writer, namespace: aigw-gateway}
---
# Readers see only the demo namespaces: for an identity that isn't a cluster admin, the
# gateway limits every query to the projects it can `get`
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata: {name: aigw-loki-reader-ns, namespace: aigw-ai}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: aigw-namespace-get}
subjects: [{kind: ServiceAccount, name: loki-reader, namespace: aigw-observability}]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata: {name: aigw-loki-reader-ns, namespace: aigw-gateway}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: aigw-namespace-get}
subjects: [{kind: ServiceAccount, name: loki-reader, namespace: aigw-observability}]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata: {name: aigw-loki-reader-ns, namespace: aigw-observability}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: aigw-namespace-get}
subjects: [{kind: ServiceAccount, name: loki-reader, namespace: aigw-observability}]
