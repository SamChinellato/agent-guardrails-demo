# Per-workload changes for OpenShift, as in ../ai/workloads.yaml. Patches name the base
# namespace (gateway); kustomize renames it to aigw-gateway.
# etcd: the image is the pinned ETCD_IMAGE@ETCD_DIGEST from versions.env (REP-02; k3d
# substitutes it from there), and its peer and client URLs name the new namespace.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: etcd
  namespace: gateway
spec:
  template:
    spec:
      securityContext: {runAsUser: null, runAsGroup: null, fsGroup: null}
      containers:
        - name: etcd
          image: quay.io/coreos/etcd:v3.6.15@sha256:7cf6622cb09b111289eed8a0cce3478e4f01d5048b0e0a1ed208299f3419334d
          command:
            - etcd
            - --name=etcd-0
            - --data-dir=/var/lib/etcd/data
            - --listen-client-urls=http://0.0.0.0:2379
            - --advertise-client-urls=http://etcd-0.etcd.aigw-gateway.svc.cluster.local:2379
            - --listen-peer-urls=http://0.0.0.0:2380
            - --initial-advertise-peer-urls=http://etcd-0.etcd.aigw-gateway.svc.cluster.local:2380
            - --initial-cluster=etcd-0=http://etcd-0.etcd.aigw-gateway.svc.cluster.local:2380
            - --initial-cluster-state=new
            - --listen-metrics-urls=http://0.0.0.0:2381
            - --auto-compaction-retention=1h
            - --quota-backend-bytes=536870912
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: killswitch
  namespace: gateway
  annotations:
    image.openshift.io/triggers: '[{"from":{"kind":"ImageStreamTag","name":"killswitch:latest","namespace":"aigw-build"},"fieldPath":"spec.template.spec.containers[?(@.name==\"killswitch\")].image"}]'
spec:
  template:
    spec:
      securityContext: {runAsUser: null, fsGroup: null}
      containers:
        - name: killswitch
          image: image-registry.openshift-image-registry.svc:5000/aigw-build/killswitch:latest
          env:
            - {name: APISIX_ADMIN_URL, value: "http://apisix-admin.aigw-gateway.svc.cluster.local:9180"}
            - {name: GATEWAY_URL, value: "http://apisix-gateway.aigw-gateway.svc.cluster.local"}
            - {name: OTEL_EXPORTER_OTLP_ENDPOINT, value: "http://otel-collector.aigw-observability.svc.cluster.local:4318"}
