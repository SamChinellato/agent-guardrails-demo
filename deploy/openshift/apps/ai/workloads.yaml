# Per-workload changes for OpenShift:
# - endpoints in the aigw- namespaces (OS-12); the collector and Prometheus are the
#   Red Hat operator instances (OS-01)
# - runAsUser: null drops the fixed UID, so restricted-v2 assigns one (OS-06)
# - the image from aigw-build, with a trigger on its ImageStreamTag <svc>:latest that
#   swaps in the current digest, so the pod spec carries it (OS-02, OS-08)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: guard
  namespace: ai          # the base namespace; kustomize renames it to aigw-ai
  annotations:
    image.openshift.io/triggers: '[{"from":{"kind":"ImageStreamTag","name":"guard:latest","namespace":"aigw-build"},"fieldPath":"spec.template.spec.containers[?(@.name==\"guard\")].image"}]'
spec:
  template:
    spec:
      securityContext: {runAsUser: null}
      containers:
        - name: guard
          image: image-registry.openshift-image-registry.svc:5000/aigw-build/guard:latest
          env:
            - {name: OTEL_EXPORTER_OTLP_ENDPOINT, value: "http://otel-collector.aigw-observability.svc.cluster.local:4318"}
            - {name: KILLSWITCH_URL, value: "http://killswitch.aigw-gateway.svc.cluster.local:8000"}
            - {name: MCP_DOCS_URL, value: "http://mcp-docs.aigw-ai.svc.cluster.local:8000/mcp"}
            - {name: MCP_ACTIONS_URL, value: "http://mcp-actions.aigw-ai.svc.cluster.local:8000/mcp"}
            # Checks the agents' on-behalf-of tokens (D-072): Verify's keys, and each agent's
            # client ID as its tokens' audience. Optional, from verify-oidc: unset, calls are anonymous.
            - name: VERIFY_TENANT
              valueFrom: {secretKeyRef: {name: verify-oidc, key: tenant, optional: true}}
            - name: VERIFY_AUDIENCE_RESEARCHER
              valueFrom: {secretKeyRef: {name: verify-oidc, key: researcher_client_id, optional: true}}
            - name: VERIFY_AUDIENCE_EXECUTOR
              valueFrom: {secretKeyRef: {name: verify-oidc, key: executor_client_id, optional: true}}
        - name: policy-sync
          # K8S_SIDECAR_IMAGE@K8S_SIDECAR_DIGEST (REP-02, make openshift-check)
          image: quay.io/kiwigrid/k8s-sidecar:2.11.2@sha256:2912be006f62f9ea080194cf6d3afcd90daead8d101d0ba686a137a849f6a4f6
---
