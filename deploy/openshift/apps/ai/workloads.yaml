apiVersion: apps/v1
kind: Deployment
metadata:
  name: researcher
  namespace: ai          # the base namespace; kustomize renames it to aigw-ai
  annotations:
    image.openshift.io/triggers: '[{"from":{"kind":"ImageStreamTag","name":"agents:latest","namespace":"aigw-build"},"fieldPath":"spec.template.spec.containers[?(@.name==\"researcher\")].image"}]'
spec:
  template:
    spec:
      securityContext: {runAsUser: null}
      containers:
        - name: researcher
          image: image-registry.openshift-image-registry.svc:5000/aigw-build/agents:latest
          env:
            - {name: GATEWAY_URL, value: "http://apisix-gateway.aigw-gateway.svc.cluster.local"}
            - {name: LLM_MODEL, value: "demo"}     # cosmetic: the gateway's llm upstream sets the model (D-060)
            - {name: OTEL_EXPORTER_OTLP_ENDPOINT, value: "http://otel-collector.aigw-observability.svc.cluster.local:4318"}
            # Exchanges the signed-in person's token for its own (D-072), with its own Verify
            # app. Optional, from verify-oidc: unset, the agent acts as itself.
            - name: VERIFY_TENANT
              valueFrom: {secretKeyRef: {name: verify-oidc, key: tenant, optional: true}}
            - name: VERIFY_CLIENT_ID
              valueFrom: {secretKeyRef: {name: verify-oidc, key: researcher_client_id, optional: true}}
            - name: VERIFY_CLIENT_SECRET
              valueFrom: {secretKeyRef: {name: verify-oidc, key: researcher_client_secret, optional: true}}
---
