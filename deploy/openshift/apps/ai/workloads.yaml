apiVersion: apps/v1
kind: Deployment
metadata:
  name: console
  namespace: ai          # the base namespace; kustomize renames it to aigw-ai
  annotations:
    image.openshift.io/triggers: '[{"from":{"kind":"ImageStreamTag","name":"console:latest","namespace":"aigw-build"},"fieldPath":"spec.template.spec.containers[?(@.name==\"console\")].image"}]'
spec:
  template:
    spec:
      securityContext: {runAsUser: null}
      containers:
        - name: console
          image: image-registry.openshift-image-registry.svc:5000/aigw-build/console:latest
          env:
            - {name: GATEWAY_URL, value: "http://apisix-gateway.aigw-gateway.svc.cluster.local"}
            - {name: KILLSWITCH_URL, value: "http://killswitch.aigw-gateway.svc.cluster.local:8000"}
            - {name: PROMETHEUS_URL, value: "http://aigw-prometheus.aigw-observability.svc.cluster.local:9090"}
            # "Decision details" opens aigw-grafana.<the console's domain> (OS-04)
            - {name: GRAFANA_SUBDOMAIN, value: aigw-grafana}
            - {name: ARCHITECTURE_IMAGE, value: architecture-openshift.png}   # "How it works" (D-062)
            # "Where it went" reads tenant "demo" through the Tempo gateway with the pod's own
            # token (ClusterRoleBinding aigw-console-tempo-reader, platform/telemetry.yaml) and
            # checks its certificate against the service CA OpenShift mounts beside the token
            - {name: TEMPO_URL, value: "https://tempo-tempo-gateway.aigw-observability.svc.cluster.local:8080/api/traces/v1/demo/tempo"}
            - {name: TEMPO_TOKEN_FILE, value: /var/run/secrets/kubernetes.io/serviceaccount/token}
            - {name: TEMPO_CA_FILE, value: /var/run/secrets/kubernetes.io/serviceaccount/service-ca.crt}
            - {name: OTEL_EXPORTER_OTLP_ENDPOINT, value: "http://otel-collector.aigw-observability.svc.cluster.local:4318"}
            # IBM Verify sign-in (D-072, docs/IDENTITY.md). The Secret is made from
            # .secrets/verify.env by scripts/openshift/verify-secret.sh, never by Argo (OS-09);
            # until it exists AUTH_MODE is unset and the console stays anonymous.
            - name: AUTH_MODE
              valueFrom: {secretKeyRef: {name: verify-oidc, key: auth_mode, optional: true}}
            - name: VERIFY_TENANT
              valueFrom: {secretKeyRef: {name: verify-oidc, key: tenant, optional: true}}
            - name: VERIFY_CLIENT_ID
              valueFrom: {secretKeyRef: {name: verify-oidc, key: console_client_id, optional: true}}
            - name: VERIFY_CLIENT_SECRET
              valueFrom: {secretKeyRef: {name: verify-oidc, key: console_client_secret, optional: true}}
            - name: VERIFY_REDIRECT_URI
              valueFrom: {secretKeyRef: {name: verify-oidc, key: redirect_uri, optional: true}}
