  annotations:
    image.openshift.io/triggers: '[{"from":{"kind":"ImageStreamTag","name":"mcp-docs:latest","namespace":"aigw-build"},"fieldPath":"spec.template.spec.containers[?(@.name==\"mcp-docs\")].image"}]'
spec:
  template:
    spec:
      securityContext: {runAsUser: null}
      containers:
        - name: mcp-docs
          image: image-registry.openshift-image-registry.svc:5000/aigw-build/mcp-docs:latest
          env:
            - {name: MCP_ALLOWED_HOSTS, value: "mcp-docs.aigw-ai.svc.cluster.local:8000,mcp-docs.aigw-ai.svc:8000,mcp-docs:8000"}
            - {name: OTEL_EXPORTER_OTLP_ENDPOINT, value: "http://otel-collector.aigw-observability.svc.cluster.local:4318"}
---
