# Workloads in the demo namespaces pull images built in aigw-build (OS-02)
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata: {name: aigw-image-pullers, namespace: aigw-build}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: system:image-puller}
subjects:
  - {kind: Group, apiGroup: rbac.authorization.k8s.io, name: "system:serviceaccounts:aigw-ai"}
  - {kind: Group, apiGroup: rbac.authorization.k8s.io, name: "system:serviceaccounts:aigw-gateway"}
  - {kind: Group, apiGroup: rbac.authorization.k8s.io, name: "system:serviceaccounts:aigw-observability"}
