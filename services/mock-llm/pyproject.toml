[project]
name = "mock-llm"
version = "0.1.0"
description = "Scripted OpenAI-compatible LLM for deterministic demo runs (7.5, REP-08)"
requires-python = "==3.12.*"
dependencies = ["demo-common", "pyyaml>=6.0,<7"]

[project.scripts]
mock-llm = "mock_llm.app:main"

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mock_llm"]

[tool.uv.sources]
demo-common = { workspace = true }
