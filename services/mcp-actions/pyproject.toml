[project]
name = "mcp-actions"
version = "0.1.0"
requires-python = "==3.12.*"
dependencies = ["demo-common[mcp]"]

[project.scripts]
mcp-actions = "mcp_actions.app:main"

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mcp_actions"]

[tool.uv.sources]
demo-common = { workspace = true }
