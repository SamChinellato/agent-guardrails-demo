[project]
name = "console"
version = "0.1.0"
description = "Presenter chat console (DEMO-01): talks to the researcher through the gateway as demo-user"
requires-python = "==3.12.*"
dependencies = ["demo-common"]

[project.scripts]
console = "console_app.app:main"

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/console_app"]

[tool.uv.sources]
demo-common = { workspace = true }
