<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Supplier assistant</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible+Next:wght@400;600;700&display=swap">
<style>
  :root {
    --fog: #eef1f4;
    --paper: #ffffff;
    --ink: #1c2433;
    --muted: #6b7484;
    --lane: #2f5aa8;
    --lane-soft: #d6e0f2;
    --stop: #c8322f;
    --stop-soft: #f7e1e0;
    --pass: #2e8a57;
    --rule: #d8dde4;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --fog: #141a24; --paper: #1d2533; --ink: #e8ecf2; --muted: #9aa3b2;
      --lane: #6f97e0; --lane-soft: #26375a; --stop: #f0706c; --stop-soft: #3a2224;
      --pass: #5cc48b; --rule: #2c3647; color-scheme: dark;
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    background: var(--fog);
    color: var(--ink);
    font: 400 18px/1.5 "Atkinson Hyperlegible Next", "Atkinson Hyperlegible", system-ui, sans-serif;
    display: flex; flex-direction: column;
  }
  header {
    display: flex; align-items: center; justify-content: space-between; gap: 16px;
    padding: 20px clamp(16px, 4vw, 48px) 12px;
  }
  h1 { font-size: 1.5rem; font-weight: 700; margin: 0; letter-spacing: -0.01em; }
  button {
    font: inherit; border-radius: 10px; cursor: pointer;
  }
  button:focus-visible, textarea:focus-visible { outline: 3px solid var(--lane); outline-offset: 2px; }
  .controls { display: flex; gap: 8px; align-items: center; }
  .reset { margin-left: auto; }
  .controls select { font: inherit; font-size: 0.95rem; color: var(--ink); background: var(--paper);
    border: 1px solid var(--rule); border-radius: 10px; padding: 8px 10px; }
  .run, .reset { padding: 8px 16px; font-size: 0.95rem; font-weight: 600; }
  .run { background: var(--lane); color: #fff; border: 0; }
  .reset { background: transparent; color: var(--muted); border: 1px solid var(--rule); }
  button:disabled { opacity: 0.45; cursor: default; }
  /* scenario title and gateway notes span the board, centred on the lane */
  .banner { grid-column: 1 / -1; text-align: center; color: var(--muted); font-weight: 600; padding: 18px 0 4px; }
  .note-row { grid-column: 1 / -1; display: flex; justify-content: center; padding: 8px 0; }
  .lane-note { max-width: 40rem; text-align: center; border-radius: 999px; padding: 6px 16px; font-size: 0.92rem;
    background: var(--paper); border: 1px solid var(--rule); color: var(--muted); }
  .lane-note.stop { background: var(--stop-soft); border-color: var(--stop); color: var(--stop); font-weight: 600; }
  .lane-note.ok { border-color: var(--pass); color: var(--pass); font-weight: 600; }
  .who { color: var(--muted); font-size: 0.85rem; margin-bottom: 4px; }

  /* The conversation: you | gateway lane | agent */
  .board {
    flex: 1; overflow-y: auto;
    display: grid; grid-template-columns: 1fr 88px 1fr; align-content: start;
    padding: 0 clamp(16px, 4vw, 48px) 24px;
    /* the gateway lane: a line down the centre of the middle column, scrolling with the chat */
    background: linear-gradient(var(--lane-soft), var(--lane-soft)) center top / 4px 100% no-repeat local;
  }
  .heads { display: contents; }
  .heads span { position: sticky; top: 0; background: var(--fog); padding: 8px 0 12px; color: var(--muted); font-size: 0.9rem; z-index: 2; }
  .heads span:nth-child(1) { grid-column: 1; }
  .heads span:nth-child(2) { grid-column: 2; text-align: center; color: var(--lane); font-weight: 600; }
  .heads span:nth-child(3) { grid-column: 3; text-align: right; }

  .row { display: contents; }
  .you, .agent { padding: 10px 0; min-width: 0; }
  .you { grid-column: 1; }
  .agent { grid-column: 3; }
  .agent { display: flex; flex-direction: column; align-items: flex-end; }
  .bubble {
    background: var(--paper); border: 1px solid var(--rule); border-radius: 14px;
    padding: 12px 16px; max-width: 34rem; white-space: pre-wrap; overflow-wrap: anywhere;
  }
  .you .bubble { border-top-left-radius: 4px; }
  .agent .bubble { border-top-right-radius: 4px; }
  .mark { grid-column: 2; display: flex; justify-content: center; align-items: flex-start; padding-top: 24px; z-index: 1; }
  .dot { width: 18px; height: 18px; border-radius: 50%; background: var(--lane); box-shadow: 0 0 0 5px var(--fog); }
  .dot.stop { background: var(--stop); border-radius: 4px; transform: rotate(45deg); }
  .dot.wait { animation: pulse 1.1s ease-in-out infinite; }
  @keyframes pulse { 50% { transform: scale(0.6); opacity: 0.5; } }

  .note { margin-top: 8px; font-size: 0.95rem; max-width: 34rem; }
  .note.stop { color: var(--stop); }
  .note .ref { color: var(--muted); font-size: 0.85rem; }
  .note a, .tools a { color: var(--muted); }
  .tools { margin-top: 6px; color: var(--muted); font-size: 0.85rem; text-align: right; max-width: 34rem; }
  .tools .denied { color: var(--stop); }
  .halt {
    background: var(--stop-soft); color: var(--stop); border-radius: 14px; border-top-right-radius: 4px;
    padding: 12px 16px; max-width: 34rem; font-weight: 600;
  }
  .empty { grid-column: 1 / -1; color: var(--muted); padding: 48px 0; text-align: center; }

  form {
    display: flex; gap: 12px; align-items: flex-end;
    padding: 16px clamp(16px, 4vw, 48px) 24px; border-top: 1px solid var(--rule); background: var(--fog);
  }
  textarea {
    flex: 1; resize: none; font: inherit; color: var(--ink); background: var(--paper);
    border: 1px solid var(--rule); border-radius: 12px; padding: 12px 14px; min-height: 52px; max-height: 160px;
  }
  .send { background: var(--lane); color: #fff; border: 0; padding: 13px 22px; font-weight: 600; }

  @media (max-width: 640px) {
    .board { grid-template-columns: 1fr 40px 1fr; }
    header { flex-wrap: wrap; }
  }
  @media (prefers-reduced-motion: reduce) { .dot.wait { animation: none; } }
</style>
</head>
<body>
<header>
  <h1>Supplier assistant</h1>
  <button class="reset" id="reset" type="button" title="Open every kill switch and restore the policy">Reset</button>
</header>

<main class="board" id="board" aria-live="polite">
  <div class="heads"><span>You</span><span>Gateway</span><span>Researcher agent</span></div>
  <p class="empty" id="empty">Ask the agent to review the supplier documents.</p>
</main>

<form id="form">
  <textarea id="input" rows="1" placeholder="Ask about the supplier reviews" aria-label="Message"></textarea>
  <button class="send" id="send" type="submit">Send</button>
</form>

<script>
const board = document.getElementById("board");
const input = document.getElementById("input");
const send = document.getElementById("send");
const resetBtn = document.getElementById("reset");
const history = [];   // only messages that reached the agent
const GRAFANA = `${location.protocol}//${location.hostname}:{{GRAFANA_PORT}}`;

// what an agent tried to do, for blocked or withheld calls
const TOOL_ATTEMPT = {
  docs__list_documents: "list documents", docs__read_document: "read a document",
  actions__update_record: "update a record", actions__send_email: "send an email",
  actions__export_customer_data: "export customer data", handoff_to_executor: "hand off to the executor",
};
const TOOL_WORDS = {
  docs__list_documents: "listed documents", docs__read_document: "read a document",
  actions__update_record: "updated a record", actions__send_email: "sent an email",
  actions__export_customer_data: "exported customer data", handoff_to_executor: "handed off to the executor",
};

// Model replies may use **bold**; show it as bold, everything else as plain text
function richText(node, text) {
  text.split(/(\*\*[^*]+\*\*)/g).forEach(part => {
    if (part.startsWith("**") && part.endsWith("**") && part.length > 4) node.append(el("strong", "", part.slice(2, -2)));
    else node.append(document.createTextNode(part));
  });
  return node;
}
function el(tag, cls, text) {
  const n = document.createElement(tag);
  if (cls) n.className = cls;
  if (text !== undefined) n.textContent = text;
  return n;
}
function traceLink(id) {
  const panes = { a: { datasource: "tempo", queries: [{ refId: "A", queryType: "traceql", query: id }], range: { from: "now-1h", to: "now" } } };
  const a = el("a", "", "trace");
  a.href = `${GRAFANA}/explore?schemaVersion=1&panes=${encodeURIComponent(JSON.stringify(panes))}`;
  a.target = "_blank"; a.rel = "noopener";
  return a;
}
function toolLine(events) {
  const tools = (events || []).filter(e => e.type === "tool");
  if (!tools.length) return null;
  const line = el("div", "tools");
  const counts = new Map();
  for (const t of tools) {
    const blockedCall = t.outcome === "denied" || t.outcome === "quarantined";
    const word = (blockedCall ? TOOL_ATTEMPT[t.tool] : TOOL_WORDS[t.tool]) || t.tool;
    const key = word + "|" + t.outcome;
    counts.set(key, (counts.get(key) || 0) + 1);
  }
  let first = true;
  for (const [key, n] of counts) {
    const [word, outcome] = key.split("|");
    if (!first) line.append(", ");
    first = false;
    const blocked = outcome === "denied" || outcome === "quarantined";
    const text = (blocked ? (outcome === "denied" ? "blocked: " : "withheld by the gateway: ") : "") + word + (n > 1 ? ` (${n}×)` : "");
    line.append(el("span", blocked ? "denied" : "", text));
  }
  return line;
}

function addRow(text) {
  document.getElementById("empty")?.remove();
  const row = el("div", "row");
  const you = el("div", "you"); you.append(el("div", "bubble", text));
  const mark = el("div", "mark"); const dot = el("div", "dot wait"); mark.append(dot);
  const agent = el("div", "agent");
  row.append(you, mark, agent);
  board.append(row);
  board.scrollTop = board.scrollHeight;
  return { you, dot, agent };
}

function render(slot, data) {
  slot.dot.classList.remove("wait");
  if (data.kind === "blocked") {
    slot.dot.classList.add("stop");
    const why = data.reason === "injection"
      ? "Stopped at the gateway: this looks like a prompt injection, so the agent never saw it."
      : "Stopped at the gateway: this matches a known attack pattern, so the agent never saw it.";
    const note = el("div", "note stop", why + " ");
    if (data.decision_id) note.append(el("span", "ref", data.decision_id));
    slot.you.append(note);
    return false;
  }
  if (data.kind === "halted" || data.status === "halted_by_kill_switch") {
    slot.dot.classList.add("stop");
    slot.agent.append(el("div", "halt", "The gateway stopped this agent. Its kill switch is on."));
    const t = toolLine(data.events); if (t) slot.agent.append(t);
    return true;
  }
  if (data.kind === "error") {
    slot.dot.classList.add("stop");
    slot.you.append(el("div", "note stop", data.message));
    return false;
  }
  if (data.status === "blocked_by_policy") slot.dot.classList.add("stop");
  slot.agent.append(richText(el("div", "bubble"), data.reply || "(no reply)"));
  const t = toolLine(data.events); if (t) slot.agent.append(t);
  if (data.trace_id) { const f = el("div", "tools"); f.append(traceLink(data.trace_id)); slot.agent.append(f); }
  history.push({ role: "assistant", content: data.reply || "" });
  return true;
}

async function ask(text, rogue = false) {
  const slot = addRow(text);
  busy(true);
  const messages = [...history, { role: "user", content: text }];
  let data;
  try {
    const r = await fetch("api/chat", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ messages, rogue }) });
    data = await r.json();
  } catch (e) {
    data = { kind: "error", message: "The console could not reach its server." };
  }
  // A blocked message never reached the agent, so it stays out of the conversation
  if (data.kind !== "blocked" && data.kind !== "error") history.push({ role: "user", content: text });
  if (data.kind === "steps") {
    slot.dot.classList.remove("wait");
    renderSteps(data.steps, slot);
    const reply = (data.steps.find(st => st.kind === "agent") || {}).reply;
    if (reply) history.push({ role: "assistant", content: reply });
  } else {
    render(slot, data);
  }
  busy(false);
  board.scrollTop = board.scrollHeight;
  input.focus();
}

document.getElementById("form").addEventListener("submit", (e) => {
  e.preventDefault();
  const text = input.value.trim();
  if (!text) return;
  input.value = "";
  ask(text);
});
input.addEventListener("keydown", (e) => {
  if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); document.getElementById("form").requestSubmit(); }
});
function busy(on) { send.disabled = resetBtn.disabled = on; }

function laneNote(tone, text) {
  const row = el("div", "note-row");
  row.append(el("div", "lane-note " + (tone || "info"), text));
  board.append(row);
}

function toolLines(events) {
  // one line per agent, so the cascade reads researcher then executor
  const byAgent = new Map();
  for (const e of events || []) {
    if (e.type !== "tool" && e.type !== "halted") continue;
    const who = e.agent || "researcher";
    if (!byAgent.has(who)) byAgent.set(who, []);
    byAgent.get(who).push(e);
  }
  const wrap = el("div");
  const multi = byAgent.size > 1;
  for (const [who, evs] of byAgent) {
    const line = toolLine(evs.filter(e => e.type === "tool")) || el("div", "tools");
    if (evs.some(e => e.type === "halted")) { line.append(line.childNodes.length ? ", " : ""); line.append(el("span", "denied", "halted by the kill switch")); }
    if (multi) line.prepend(el("strong", "", who[0].toUpperCase() + who.slice(1) + ": "));
    wrap.append(line);
  }
  return wrap;
}

function renderSteps(steps, first = null) {
  let slot = first;
  for (const st of steps) {
    if (st.kind === "lane") { laneNote(st.tone, st.text); slot = null; continue; }
    if (st.kind === "user") { slot = addRow(st.text); slot.dot.classList.remove("wait"); continue; }
    if (st.kind === "blocked") {
      const s2 = addRow(st.text);
      s2.you.prepend(el("div", "who", `sent by the ${st.who}`));
      render(s2, st.status === 200 ? { kind: "error", message: "This one got through." } : { kind: "blocked", reason: st.reason, decision_id: st.decision_id });
      continue;
    }
    if (st.kind === "agent") {
      if (!slot) slot = addRow("");
      const halted = st.status === "halted_by_kill_switch";
      if (halted) { slot.dot.classList.add("stop"); slot.agent.append(el("div", "halt", "The gateway stopped this agent. Its kill switch is on.")); }
      else { slot.agent.append(richText(el("div", "bubble"), st.reply || "(no reply)")); }
      slot.agent.append(toolLines(st.events));
      if (st.trace_id) { const f = el("div", "tools"); f.append(traceLink(st.trace_id)); slot.agent.append(f); }
      slot = null;
    }
  }
  board.scrollTop = board.scrollHeight;
}

async function runScenario(id, title) {
  document.getElementById("empty")?.remove();
  board.append(el("div", "banner", title));
  const pending = el("div", "note-row"); pending.append(el("div", "lane-note", "Running…")); board.append(pending);
  board.scrollTop = board.scrollHeight;
  busy(true);
  let data;
  try {
    const r = await fetch("api/scenario", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ id }) });
    data = await r.json();
  } catch (e) {
    data = { steps: [{ kind: "lane", tone: "stop", text: "The console could not reach its server." }] };
  }
  pending.remove();
  renderSteps(data.steps || []);
  busy(false);
}

resetBtn.addEventListener("click", async () => {
  busy(true);
  const r = await fetch("api/scenario", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ id: "reset" }) });
  const d = await r.json();
  for (const st of d.steps || []) laneNote(st.tone, st.text);
  board.scrollTop = board.scrollHeight;
  busy(false);
});
input.focus();
</script>
</body>
</html>
