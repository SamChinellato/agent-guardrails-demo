<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Supplier assistant</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible+Next:wght@400;600;700&display=swap">
<style>
  :root {
    --fog: #eef1f4;
    --paper: #ffffff;
    --ink: #1c2433;
    --muted: #6b7484;
    --lane: #2f5aa8;
    --lane-soft: #d6e0f2;
    --stop: #c8322f;
    --stop-soft: #f7e1e0;
    --rule: #d8dde4;
    /* Light only, whatever the OS asks for: it reads better on a projector (D-068) */
    color-scheme: light;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    background: var(--fog); color: var(--ink);
    font: 400 17px/1.5 "Atkinson Hyperlegible Next", "Atkinson Hyperlegible", system-ui, sans-serif;
    display: flex; flex-direction: column;
  }
  button { font: inherit; cursor: pointer; }
  button:focus-visible, textarea:focus-visible, a:focus-visible, .msg:focus-visible { outline: 3px solid var(--lane); outline-offset: 2px; }
  button:disabled { opacity: 0.45; cursor: default; }

  header {
    display: flex; align-items: center; gap: 12px;
    padding: 14px clamp(16px, 3vw, 32px); border-bottom: 1px solid var(--rule); background: var(--paper);
  }
  h1 { font-size: 1.15rem; font-weight: 700; margin: 0; }
  .persona { color: var(--muted); font-size: 0.9rem; margin: 0; }
  .persona a { color: var(--muted); }
  .spacer { flex: 1; }
  .hbtn { background: transparent; color: var(--ink); border: 1px solid var(--rule); border-radius: 10px; padding: 7px 14px; font-size: 0.92rem; }
  .hbtn[aria-pressed="true"] { background: var(--lane); border-color: var(--lane); color: #fff; }

  .shell { flex: 1; display: flex; min-height: 0; }
  .chat { flex: 1; display: flex; flex-direction: column; min-width: 0; }
  .scroll { flex: 1; overflow-y: auto; }
  .thread { max-width: 46rem; margin: 0 auto; padding: 24px 16px 8px; display: flex; flex-direction: column; gap: 18px; }

  .welcome { margin: 12vh auto 0; text-align: center; max-width: 32rem; }
  .welcome h2 { font-size: 1.6rem; margin: 0 0 20px; }
  .starters { display: flex; flex-direction: column; gap: 8px; }
  .starters button { text-align: left; background: var(--paper); border: 1px solid var(--rule); border-radius: 12px; padding: 10px 14px; color: var(--ink); }

  /* one exchange: your message, then the assistant's answer and any gateway notices */
  .exchange { display: flex; flex-direction: column; gap: 10px; padding-left: 14px; margin-left: -18px; border-left: 4px solid transparent; }
  .exchange.selected { border-left-color: var(--lane-soft); }
  .user { align-self: flex-end; max-width: 80%; background: var(--lane); color: #fff; border-radius: 18px 18px 4px 18px;
    padding: 10px 16px; white-space: pre-wrap; overflow-wrap: anywhere; }
  .assistant { align-self: flex-start; max-width: 90%; }
  .answer { white-space: pre-wrap; overflow-wrap: anywhere; }
  .meta { color: var(--muted); font-size: 0.85rem; margin-top: 6px; }
  .meta a, .meta button { color: var(--muted); background: none; border: 0; padding: 0; text-decoration: underline; font-size: inherit; }
  .meta .sep { margin: 0 6px; }

  .notice { align-self: flex-start; max-width: 90%; background: var(--stop-soft); border-left: 4px solid var(--stop);
    border-radius: 4px 12px 12px 4px; padding: 10px 14px; }
  .notice strong { display: block; color: var(--stop); }
  .notice p { margin: 2px 0 0; }

  .typing { align-self: flex-start; display: flex; gap: 5px; padding: 8px 0; }
  .typing i { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); animation: bob 1.2s ease-in-out infinite; }
  .typing i:nth-child(2) { animation-delay: 0.15s; } .typing i:nth-child(3) { animation-delay: 0.3s; }
  @keyframes bob { 40% { transform: translateY(-5px); opacity: 0.5; } }
  .small { color: var(--muted); font-size: 0.88rem; text-align: center; }

  form { max-width: 46rem; width: 100%; margin: 0 auto; padding: 8px 16px 20px; display: flex; gap: 10px; align-items: flex-end; }
  textarea {
    flex: 1; resize: none; font: inherit; color: var(--ink); background: var(--paper);
    border: 1px solid var(--rule); border-radius: 14px; padding: 12px 14px; min-height: 50px; max-height: 160px;
  }
  .attach { background: var(--paper); color: var(--ink); border: 1px solid var(--rule); border-radius: 12px; padding: 12px 14px; }
  .upload { align-self: flex-end; background: var(--paper); border: 1px solid var(--rule); border-radius: 12px; padding: 8px 14px; font-size: 0.92rem; }
  .upload span { color: var(--muted); }
  .send { background: var(--lane); color: #fff; border: 0; border-radius: 12px; padding: 12px 20px; font-weight: 600; }

  /* Monitoring: where the selected message went */
  .monitor { width: 380px; flex: none; border-left: 1px solid var(--rule); background: var(--paper); overflow-y: auto; padding: 18px 20px; }
  .monitor[hidden] { display: none; }
  .monitor h2 { font-size: 1.05rem; margin: 0; }
  .monitor .for { color: var(--muted); font-size: 0.88rem; margin: 2px 0 10px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .monitor svg { width: 100%; height: auto; display: block; }
  .monitor ul { list-style: none; padding: 0; margin: 8px 0 0; font-size: 0.9rem; }
  .monitor li { padding: 5px 0; border-top: 1px solid var(--rule); }
  .monitor li.bad { color: var(--stop); }
  .monitor .hint { color: var(--muted); font-size: 0.85rem; margin-top: 12px; }
  .node rect { fill: var(--paper); stroke: var(--rule); stroke-width: 1.5; stroke-dasharray: 4 3; }
  .node text { fill: var(--muted); font-size: 13px; text-anchor: middle; dominant-baseline: central; }
  .node.on rect { stroke: var(--ink); stroke-dasharray: none; }
  .node.on text { fill: var(--ink); font-weight: 600; }
  .node.bad rect { stroke: var(--stop); stroke-width: 2; fill: var(--stop-soft); stroke-dasharray: none; }
  .node.bad text { fill: var(--stop); font-weight: 600; }
  .node .tag { font-size: 11px; font-weight: 400; }
  .edge line { stroke: var(--rule); stroke-width: 2; }
  .edge.on line { stroke: var(--lane); stroke-width: 2.5; }
  .edge.bad line { stroke: var(--stop); }
  .edge circle { fill: var(--rule); }
  .edge.on circle { fill: var(--lane); stroke: var(--paper); stroke-width: 3; }
  .edge.bad .gate { fill: var(--stop); stroke: var(--paper); stroke-width: 3; }
  .edge text { fill: var(--muted); font-size: 11px; }

  @media (max-width: 860px) {
    .monitor { position: fixed; inset: 64px 0 0 auto; width: min(380px, 100vw); box-shadow: -8px 0 24px rgba(0,0,0,0.12); z-index: 5; }
    .persona { display: none; }
  }
  @media (prefers-reduced-motion: reduce) { .typing i { animation: none; } }
</style>
</head>
<body>
<header>
  <div>
    <h1>Supplier assistant</h1>
    <p class="persona">Acme procurement. You're signed in as a procurement analyst. <a href="architecture.png" target="_blank" rel="noopener">How it works</a></p>
  </div>
  <span class="spacer"></span>
  <button class="hbtn" id="monitorBtn" type="button" aria-pressed="false" aria-controls="monitor">Monitoring</button>
  <button class="hbtn" id="newChat" type="button" title="Clear the chat, close every circuit breaker and restore the policy">New chat</button>
</header>

<div class="shell">
  <main class="chat">
    <div class="scroll" id="scroll">
      <div class="thread" id="thread" aria-live="polite"></div>
    </div>
    <form id="form">
      <button class="attach" id="attach" type="button" title="Add a supplier document to the store" aria-label="Upload a document">Upload</button>
      <input id="file" type="file" accept=".md,.txt,text/markdown,text/plain" hidden>
      <textarea id="input" rows="1" placeholder="Message the supplier assistant" aria-label="Message"></textarea>
      <button class="send" id="send" type="submit">Send</button>
    </form>
  </main>
  <aside class="monitor" id="monitor" hidden aria-label="Monitoring">
    <h2>Where it went</h2>
    <p class="for" id="monFor">Send a message to see its path.</p>
    <div id="monBody"></div>
  </aside>
</div>

<template id="welcome">
  <div class="welcome">
    <h2>How can I help with suppliers today?</h2>
    <div class="starters">
      <button type="button">Which suppliers are below their on-time delivery target?</button>
      <button type="button">Review the Meridian Data Services document</button>
      <button type="button">Review Coastal Analytics and take care of its open items</button>
    </div>
  </div>
</template>

<script>
const thread = document.getElementById("thread");
const scroller = document.getElementById("scroll");
const input = document.getElementById("input");
const send = document.getElementById("send");
const newChat = document.getElementById("newChat");
const monitorBtn = document.getElementById("monitorBtn");
const monitor = document.getElementById("monitor");
const GRAFANA = "{{GRAFANA_SUBDOMAIN}}"   // OpenShift: a sibling Route host; k3d: a host port
  ? `${location.protocol}//{{GRAFANA_SUBDOMAIN}}.${location.hostname.split(".").slice(1).join(".")}`
  : `${location.protocol}//${location.hostname}:{{GRAFANA_PORT}}`;
let history = [];        // only messages that reached the assistant
let selected = null;     // the exchange shown in Monitoring
const flowCache = new Map();

const TOOL_ATTEMPT = {
  docs__list_documents: "list documents", docs__read_document: "read a document",
  actions__update_record: "update a record", actions__send_email: "send an email",
  actions__export_customer_data: "export customer data", handoff_to_executor: "hand off to the executor",
};

function el(tag, cls, text) {
  const n = document.createElement(tag);
  if (cls) n.className = cls;
  if (text !== undefined) n.textContent = text;
  return n;
}
// Model replies may use **bold**; show it as bold, everything else as plain text
function richText(node, text) {
  text.split(/(\*\*[^*]+\*\*)/g).forEach(part => {
    if (part.startsWith("**") && part.endsWith("**") && part.length > 4) node.append(el("strong", "", part.slice(2, -2)));
    else node.append(document.createTextNode(part));
  });
  return node;
}
function down() { scroller.scrollTop = scroller.scrollHeight; }

function showWelcome() {
  thread.replaceChildren(document.getElementById("welcome").content.cloneNode(true));
  thread.querySelectorAll(".starters button").forEach(b => b.addEventListener("click", () => ask(b.textContent)));
}

// ------------------------------------------------------------------ gateway notices
function notice(title, text) {
  const n = el("div", "notice");
  n.append(el("strong", "", title), el("p", "", text));
  return n;
}
function blockedNotice(d) {
  if (d.reason === "injection") {
    const score = d.score != null && d.threshold != null
      ? ` The gateway's injection check scored it ${Number(d.score).toFixed(2)}; anything above ${d.threshold} is blocked.` : "";
    return notice("Blocked by the gateway",
      "Your message reads like an attempt to override the assistant's instructions, so it never reached the assistant." + score +
      " Try asking an ordinary question.");
  }
  return notice("Blocked by the gateway",
    "Your message contains a phrase used in known prompt-injection attacks, so it never reached the assistant.");
}
// The title says what suspended the agent when the console could find out (D-069)
const suspendedNotice = d => d && d.title ? notice(d.title, d.text) : notice("Assistant suspended",
  "The gateway's circuit breaker is open for this assistant, so it can't answer. Start a new chat to reset it.");

function withheldNotice(events) {
  if (!(events || []).some(e => e.outcome === "quarantined")) return null;
  return notice("A document was withheld",
    "One document contains hidden instructions aimed at AI assistants, so the gateway kept it from the assistant.");
}
function deniedNotice(events) {
  const denied = (events || []).filter(e => e.outcome === "denied");
  if (!denied.length) return null;
  const what = [...new Set(denied.map(e => TOOL_ATTEMPT[e.tool] || e.tool))].join(", ");
  return notice("Action blocked by the gateway", `An agent tried to ${what}, which Acme policy doesn't allow.`);
}

function metaLine(ex, extra) {
  const m = el("div", "meta");
  if (extra) m.append(extra);
  if (ex.traceId) {
    const flowBtn = el("button", "", "Where it went");
    flowBtn.type = "button";
    flowBtn.addEventListener("click", () => { select(ex); setMonitor(true); });
    const a = el("a", "", "Decision details");
    a.href = `${GRAFANA}/d/decision-trail?var-trace_id=${encodeURIComponent(ex.traceId)}&from=now-1h&to=now`;
    a.target = "_blank"; a.rel = "noopener";
    const links = el("div");
    links.append(flowBtn, el("span", "sep", "|"), a);
    m.append(links);
  }
  return m;
}

// ------------------------------------------------------------------ one exchange
function render(ex, d) {
  const box = ex.node;
  ex.traceId = d.trace_id || null;
  if (d.kind === "blocked") { box.append(blockedNotice(d), metaLine(ex)); return; }
  if (d.kind === "error") { box.append(notice("Something went wrong", d.message)); return; }
  if (d.kind === "halted") { box.append(suspendedNotice(d), metaLine(ex)); return; }

  const steps = d.kind === "steps" ? d.steps : [{ ...d, kind: "agent" }];
  const trips = steps.filter(s => s.kind === "lane" && s.tone === "stop");
  ex.suspended = trips.map(s => s.scope).filter(Boolean);
  for (const st of steps.filter(s => s.kind === "agent")) {
    const halted = st.status === "halted_by_kill_switch";
    // A halted agent's reply is only "Halted: ..."; the notice below says why. The poisoned-document
    // story shows the withheld notice alone, with no answer (D-069)
    if (!halted && !st.withheld_only) {
      const a = el("div", "assistant");
      a.append(richText(el("div", "answer"), st.reply || "(no reply)"));
      box.append(a);
    }
    const w = withheldNotice(st.events); if (w) box.append(w);
    if (!trips.length) { const n = deniedNotice(st.events); if (n) box.append(n); }
    if (halted && !trips.length) box.append(suspendedNotice(st));
    for (const t of trips) box.append(notice(t.title || "The gateway suspended an agent", t.text));
    box.append(metaLine(ex));
    if (st.reply && !st.withheld_only) history.push({ role: "assistant", content: st.reply });
  }
}

async function ask(text) {
  text = text.trim();
  if (!text || send.disabled) return;
  if (thread.querySelector(".welcome")) thread.replaceChildren();
  const node = el("section", "exchange");
  node.append(el("div", "user", text));
  const typing = el("div", "typing"); typing.setAttribute("aria-label", "The assistant is working");
  typing.append(el("i"), el("i"), el("i"));
  node.append(typing);
  thread.append(node);
  const ex = { node, text, traceId: null, suspended: [] };
  down();
  busy(true);
  const messages = [...history, { role: "user", content: text }];
  let d;
  try {
    const r = await fetch("api/chat", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ messages }) });
    d = await r.json();
  } catch (e) {
    d = { kind: "error", message: "The console could not reach its server." };
  }
  typing.remove();
  // a blocked message never reached the assistant, so it stays out of the conversation
  if (d.kind !== "blocked" && d.kind !== "error") history.push({ role: "user", content: text });
  render(ex, d);
  busy(false);
  if (ex.traceId) select(ex);
  down();
  input.focus();
}

function busy(on) { send.disabled = newChat.disabled = attach.disabled = on; }

// ------------------------------------------------------------------ uploads (D-047)
const attach = document.getElementById("attach");
const fileInput = document.getElementById("file");
attach.addEventListener("click", () => fileInput.click());
fileInput.addEventListener("change", async () => {
  const f = fileInput.files[0];
  fileInput.value = "";
  if (!f) return;
  if (thread.querySelector(".welcome")) thread.replaceChildren();
  const node = el("section", "exchange");
  const chip = el("div", "upload", `Uploading ${f.name}…`);
  node.append(chip);
  thread.append(node);
  down();
  busy(true);
  let d;
  try {
    if (f.size > 32 * 1024) throw new Error("Documents can be at most 32 KB.");
    const r = await fetch("api/upload", { method: "POST", headers: { "Content-Type": "application/json" },
                                          body: JSON.stringify({ name: f.name, content: await f.text() }) });
    d = await r.json();
    if (!r.ok) throw new Error(d.error || "The upload failed.");
  } catch (e) {
    chip.remove();
    node.append(notice("Upload failed", e.message));
    busy(false);
    return;
  }
  chip.textContent = `Uploaded ${f.name} `;
  chip.append(el("span", "", `as ${d.id}, ${d.supplier}`));
  busy(false);
  input.value = `Review the document I uploaded (${d.id})`;
  input.focus();
});

document.getElementById("form").addEventListener("submit", (e) => {
  e.preventDefault();
  const text = input.value;
  input.value = "";
  ask(text);
});
input.addEventListener("keydown", (e) => {
  if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); document.getElementById("form").requestSubmit(); }
});
input.addEventListener("input", () => { input.style.height = "auto"; input.style.height = Math.min(input.scrollHeight, 160) + "px"; });

newChat.addEventListener("click", async () => {
  busy(true);
  history = []; selected = null;
  thread.replaceChildren(el("p", "small", "Starting a new chat…"));
  drawEmpty();
  let note = "";
  try {
    const r = await fetch("api/scenario", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ id: "reset" }) });
    const t = ((await r.json()).steps || [])[0]?.text || "";
    if (t.includes("released")) note = t;
  } catch (e) { note = "The reset could not reach the server."; }
  showWelcome();
  if (note) thread.append(el("p", "small", note));
  busy(false);
  input.focus();
});

// ------------------------------------------------------------------ monitoring
const NODES = {
  you:        { x: 180, y: 36,  label: "You" },
  researcher: { x: 180, y: 136, label: "Researcher agent" },
  docs:       { x: 62,  y: 250, label: "Documents tool" },
  executor:   { x: 298, y: 250, label: "Executor agent" },
  llm:        { x: 180, y: 330, label: "LLM API" },
  actions:    { x: 298, y: 390, label: "Actions tool" },
  killswitch: { x: 62,  y: 390, label: "Circuit breaker" },
};
const LINKS = {
  "you-researcher": ["you", "researcher"], "researcher-docs": ["researcher", "docs"],
  "researcher-llm": ["researcher", "llm"], "researcher-executor": ["researcher", "executor"],
  "executor-llm": ["executor", "llm"], "executor-actions": ["executor", "actions"],
};
const NAME = { you: "You", researcher: "Researcher", executor: "Executor", docs: "documents tool", llm: "LLM API", actions: "actions tool" };
const SVG = "http://www.w3.org/2000/svg";
function s(tag, attrs, text) {
  const n = document.createElementNS(SVG, tag);
  for (const [k, v] of Object.entries(attrs || {})) n.setAttribute(k, v);
  if (text !== undefined) n.textContent = text;
  return n;
}

function draw(flow, suspendedScopes) {
  const links = flow?.links || {};
  const scopes = new Set([...(flow?.kills || []), ...(suspendedScopes || [])]);
  const suspended = new Set();
  for (const sc of scopes) {
    if (sc === "global") { suspended.add("researcher"); suspended.add("executor"); }
    else if (sc.startsWith("agent:")) suspended.add(sc.slice(6));
  }
  const anyStopped = Object.values(links).some(l => l.stopped);
  const svg = s("svg", { viewBox: "0 0 360 420", role: "img", "aria-label": "Components this message passed through" });
  const used = new Set();
  for (const [id, [a, b]] of Object.entries(LINKS)) {
    const l = links[id], A = NODES[a], B = NODES[b];
    const bad = l && (l.blocked || l.withheld || l.stopped);
    if (l) { used.add(a); used.add(b); }
    const g = s("g", { class: "edge" + (l ? " on" : "") + (bad ? " bad" : "") });
    g.append(s("line", { x1: A.x, y1: A.y, x2: B.x, y2: B.y }));
    const mx = (A.x + B.x) / 2, my = (A.y + B.y) / 2;
    // the gateway check on this link: a dot, or a red diamond where it stopped something
    if (bad) g.append(s("rect", { class: "gate", x: mx - 7, y: my - 7, width: 14, height: 14, rx: 2, transform: `rotate(45 ${mx} ${my})` }));
    else g.append(s("circle", { cx: mx, cy: my, r: 7 }));
    if (l) g.append(s("text", { x: mx + 12, y: my - 8 }, `${l.calls}×`));
    svg.append(g);
  }
  for (const [id, n] of Object.entries(NODES)) {
    const ks = id === "killswitch" && (suspended.size || anyStopped);
    const bad = ks || suspended.has(id) || Object.entries(LINKS).some(([lid, [, b]]) => b === id && links[lid] && (links[lid].blocked));
    const g = s("g", { class: "node" + (used.has(id) || ks ? " on" : "") + (bad ? " bad" : "") });
    g.append(s("rect", { x: n.x - 56, y: n.y - 20, width: 112, height: 40, rx: 10 }));
    const sub = suspended.has(id) ? "suspended" : ks ? "on" : "";
    g.append(s("text", { x: n.x, y: n.y - (sub ? 6 : 0) }, n.label));
    if (sub) g.append(s("text", { x: n.x, y: n.y + 10, class: "tag" }, sub));
    svg.append(g);
  }
  // node labels sized to fit: shrink the long ones
  svg.querySelectorAll(".node text:not(.tag)").forEach(t => { if (t.textContent.length > 14) t.setAttribute("font-size", "12"); });
  return svg;
}

function sentences(flow, suspendedScopes) {
  const ul = el("ul");
  for (const [id, [a, b]] of Object.entries(LINKS)) {
    const l = flow.links[id];
    if (!l) continue;
    const parts = [`${l.calls} ${l.calls === 1 ? "call" : "calls"}`];
    if (l.blocked) parts.push(`${l.blocked} blocked`);
    if (l.withheld) parts.push(`${l.withheld} withheld`);
    if (l.stopped) parts.push(`${l.stopped} refused by the circuit breaker`);
    const li = el("li", l.blocked || l.withheld || l.stopped ? "bad" : "",
      `${NAME[a]} to ${b === "executor" ? "Executor" : NAME[b]}: ${parts.join(", ")}` + (l.details.length ? ` (${l.details.join("; ")})` : ""));
    ul.append(li);
  }
  const scopes = new Set([...(flow.kills || []), ...(suspendedScopes || [])]);
  for (const sc of scopes) ul.append(el("li", "bad", `Circuit breaker: suspended ${sc === "global" ? "everything" : "the " + sc.replace("agent:", "") + " agent"}`));
  return ul;
}

function drawEmpty() {
  document.getElementById("monFor").textContent = "Send a message to see its path.";
  document.getElementById("monBody").replaceChildren(draw(null), el("p", "hint", "Every line passes through the gateway. The dot on each line is where the gateway checks the call; a red diamond means it stopped something."));
}

async function showFlow(ex) {
  const body = document.getElementById("monBody");
  document.getElementById("monFor").textContent = `“${ex.text}”`;
  if (!ex.traceId) { body.replaceChildren(el("p", "hint", "No trace was recorded for this message.")); return; }
  let flow = flowCache.get(ex.traceId);
  if (!flow) {
    body.replaceChildren(draw(null), el("p", "hint", "Reading the trace…"));
    try { flow = await (await fetch(`api/flow/${ex.traceId}`)).json(); } catch (e) { flow = null; }
    if (flow && flow.complete) flowCache.set(ex.traceId, flow);
  }
  if (selected !== ex) return;
  if (!flow || !Object.keys(flow.links || {}).length) {
    body.replaceChildren(draw(null), el("p", "hint", "The trace hasn't arrived yet. Click “Where it went” again in a few seconds."));
    return;
  }
  body.replaceChildren(draw(flow, ex.suspended), sentences(flow, ex.suspended),
    el("p", "hint", "Every line passes through the gateway. The dot on each line is where the gateway checks the call; a red diamond means it stopped something."));
}

function select(ex) {
  if (selected) selected.node.classList.remove("selected");
  selected = ex;
  if (!monitor.hidden) { ex.node.classList.add("selected"); showFlow(ex); }
}
function setMonitor(on) {
  monitor.hidden = !on;
  monitorBtn.setAttribute("aria-pressed", String(on));
  if (on && selected) select(selected);
  else if (!on && selected) selected.node.classList.remove("selected");
}
monitorBtn.addEventListener("click", () => setMonitor(monitor.hidden));

showWelcome();
drawEmpty();
input.focus();
</script>
</body>
</html>
