[project]
name = "killswitch"
version = "0.1.0"
description = "Kill-switch API, control panel and audit log (7.4)"
requires-python = "==3.12.*"
dependencies = ["demo-common", "python-multipart>=0.0.20,<1"]

[project.scripts]
killswitch = "killswitch.app:main"

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/killswitch"]

[tool.uv.sources]
demo-common = { workspace = true }
