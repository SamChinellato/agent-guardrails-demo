[project]
name = "mcp-docs"
version = "0.1.0"
requires-python = "==3.12.*"
dependencies = ["demo-common[mcp]"]

[project.scripts]
mcp-docs = "mcp_docs.app:main"

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mcp_docs"]

[tool.uv.sources]
demo-common = { workspace = true }
