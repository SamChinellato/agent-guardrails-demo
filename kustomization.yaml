# OpenShift workloads for Argo CD (OS-08), built from the repo root so the ConfigMaps can
# read scenarios/ and policy/ in place (D-054). Generated by
# scripts/openshift/gen-root-kustomization.sh; don't edit by hand. k3d doesn't use it.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - deploy/openshift/apps/ai
  - deploy/openshift/apps/gateway
generatorOptions:
  disableNameSuffixHash: true   # the workloads mount these by name, as on k3d
configMapGenerator:
  - name: mock-llm-scripts
    namespace: aigw-ai
    files:
      - scenarios/fixtures/mock-llm/chat.yaml
      - scenarios/fixtures/mock-llm/coastal.yaml
      - scenarios/fixtures/mock-llm/meridian.yaml
      - scenarios/fixtures/mock-llm/s0.yaml
      - scenarios/fixtures/mock-llm/s1.yaml
      - scenarios/fixtures/mock-llm/s2.yaml
      - scenarios/fixtures/mock-llm/s3.yaml
      - scenarios/fixtures/mock-llm/s5.yaml
      - scenarios/fixtures/mock-llm/s6-rogue.yaml
      - scenarios/fixtures/mock-llm/smoke.yaml
  - name: fixtures-documents
    namespace: aigw-ai
    files:
      - scenarios/fixtures/documents/supplier-01.md
      - scenarios/fixtures/documents/supplier-02.md
      - scenarios/fixtures/documents/supplier-03.md
      - scenarios/fixtures/documents/supplier-04.md
      - scenarios/fixtures/documents/supplier-05.md
      - scenarios/fixtures/documents/supplier-06.md
      - scenarios/fixtures/documents/supplier-07.md
  - name: fixtures-records
    namespace: aigw-ai
    files:
      - scenarios/fixtures/records.json
  # What the console restores (D-043)
  - name: guard-policy-baseline
    namespace: aigw-ai
    files:
      - policy/policy.yaml
  # The live policy: created from git once, then changed by the console and make
  # policy-set. The Application ignores its data, so a sync never reverts those changes.
  - name: guard-policy
    namespace: aigw-ai
    options:
      annotations: {argocd.argoproj.io/sync-options: Prune=false}
    files:
      - policy/policy.yaml
