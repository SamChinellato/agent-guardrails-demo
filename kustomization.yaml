# OpenShift workloads and telemetry for Argo CD (OS-08), built from the repo root so the
# ConfigMaps and alert rules can read scenarios/, policy/, gateway/ and observability/ in
# place (D-054). Generated by
# scripts/openshift/gen-root-kustomization.sh; don't edit by hand. k3d doesn't use it.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - deploy/openshift/apps/ai
  - deploy/openshift/apps/gateway
  - deploy/openshift/apps/networkpolicies.yaml
  - deploy/openshift/telemetry
  # The k3d alert rules, unchanged but for the API group (OS-01, KS-10)
  - observability/alerts/killswitch.yaml
patches:
  - target: {group: monitoring.coreos.com, kind: PrometheusRule}
    patch: |-
      - {op: replace, path: /apiVersion, value: monitoring.rhobs/v1}
      - {op: replace, path: /metadata/namespace, value: aigw-observability}
      - {op: add, path: /metadata/labels, value: {app.kubernetes.io/part-of: ai-gateway-demo}}
generatorOptions:
  disableNameSuffixHash: true   # the workloads mount these by name, as on k3d
configMapGenerator:
  - name: mock-llm-scripts
    namespace: aigw-ai
    files:
      - scenarios/fixtures/mock-llm/chat.yaml
      - scenarios/fixtures/mock-llm/coastal.yaml
      - scenarios/fixtures/mock-llm/meridian.yaml
      - scenarios/fixtures/mock-llm/s0.yaml
      - scenarios/fixtures/mock-llm/s1.yaml
      - scenarios/fixtures/mock-llm/s2.yaml
      - scenarios/fixtures/mock-llm/s3.yaml
      - scenarios/fixtures/mock-llm/s5.yaml
      - scenarios/fixtures/mock-llm/s6-rogue.yaml
      - scenarios/fixtures/mock-llm/smoke.yaml
  - name: fixtures-documents
    namespace: aigw-ai
    files:
      - scenarios/fixtures/documents/supplier-01.md
      - scenarios/fixtures/documents/supplier-02.md
      - scenarios/fixtures/documents/supplier-03.md
      - scenarios/fixtures/documents/supplier-04.md
      - scenarios/fixtures/documents/supplier-05.md
      - scenarios/fixtures/documents/supplier-06.md
      - scenarios/fixtures/documents/supplier-07.md
  - name: fixtures-records
    namespace: aigw-ai
    files:
      - scenarios/fixtures/records.json
  # What the console restores (D-043)
  - name: guard-policy-baseline
    namespace: aigw-ai
    files:
      - policy/policy.yaml
  # The live policy: created from git once, then changed by the console and make
  # policy-set. The Application ignores its data, so a sync never reverts those changes.
  - name: guard-policy
    namespace: aigw-ai
    options:
      annotations: {argocd.argoproj.io/sync-options: Prune=false}
    files:
      - policy/policy.yaml
  # gguf-fetch and llama.cpp's verify-model step (OS-16): the script and the pinned hashes
  - name: model-fetch
    namespace: aigw-ai
    files:
      - deploy/openshift/llm/fetch_model.py
      - deploy/openshift/llm/granite-4.0-micro-gguf.sha256
  # The LLM mode the gateway-bootstrap Job applies (D-060): live on a fresh install, then
  # switched by make llm-mode. The Application ignores its data, like guard-policy.
  - name: llm-mode
    namespace: aigw-gateway
    options:
      annotations: {argocd.argoproj.io/sync-options: Prune=false}
    literals:
      - mode=live
  # APISIX's custom Lua plugins, one ConfigMap each (the chart names a volume per ConfigMap)
  - name: apisix-plugin-agent-kill-switch
    namespace: aigw-gateway
    files:
      - gateway/plugins/agent-kill-switch.lua
  - name: apisix-plugin-ai-injection-guard
    namespace: aigw-gateway
    files:
      - gateway/plugins/ai-injection-guard.lua
  # Grafana dashboards (OBS-05), unchanged from k3d; dashboards.yaml points one
  # GrafanaDashboard at each
  - name: dashboard-agent-behaviour
    namespace: aigw-observability
    files:
      - observability/dashboards/agent-behaviour.json
  - name: dashboard-ai-gateway-overview
    namespace: aigw-observability
    files:
      - observability/dashboards/ai-gateway-overview.json
  - name: dashboard-decision-trail
    namespace: aigw-observability
    files:
      - observability/dashboards/decision-trail.json
  - name: dashboard-incident
    namespace: aigw-observability
    files:
      - observability/dashboards/incident.json
  # gateway/ for the gateway-bootstrap Job (OS-10), one ConfigMap per kind, mounted at
  # /gateway/<kind> (ConfigMap keys can't hold a path)
  - name: gateway-consumers
    namespace: aigw-gateway
    files:
      - gateway/consumers/demo-user.json
      - gateway/consumers/executor.json
      - gateway/consumers/probe.json
      - gateway/consumers/researcher.json
  - name: gateway-plugin-configs
    namespace: aigw-gateway
    files:
      - gateway/plugin_configs/pc-agents.json
      - gateway/plugin_configs/pc-llm.json
      - gateway/plugin_configs/pc-mcp.json
  - name: gateway-plugin-metadata
    namespace: aigw-gateway
    files:
      - gateway/plugin_metadata/opentelemetry.json
  - name: gateway-routes
    namespace: aigw-gateway
    files:
      - gateway/routes/agent-executor.json
      - gateway/routes/agent-researcher.json
      - gateway/routes/console-landing.json
      - gateway/routes/console-root.json
      - gateway/routes/console.json
      - gateway/routes/demo-documents.json
      - gateway/routes/guard-policy.json
      - gateway/routes/llm-scripted.json
      - gateway/routes/llm.json
      - gateway/routes/mcp-actions.json
      - gateway/routes/mcp-docs.json
  - name: gateway-upstreams
    namespace: aigw-gateway
    files:
      - gateway/upstreams/guard.json
      - gateway/upstreams/llm.live.json
      - gateway/upstreams/llm.mock.json
